  @keyframes ph3 { 0% { opacity: 0; } 60% { opacity: 0; } 62% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
  .a-blind { animation: blindIn 15s linear infinite; } .a-slo { animation: sloIn 15s linear infinite; }
  .a-gap { animation: gapIn 15s linear infinite; } .a-tag { animation: tagIn 15s linear infinite; }
  .a-ph1 { animation: ph1 15s linear infinite; } .a-ph2 { animation: ph2 15s linear infinite; } .a-ph3 { animation: ph3 15s linear infinite; }
  @keyframes hollow0 { 0% { fill-opacity: 1; } 48.8% { fill-opacity: 1; } 50.0% { fill-opacity: 0; } 97% { fill-opacity: 0; } 100% { fill-opacity: 1; } }
