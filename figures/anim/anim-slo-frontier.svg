<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<!--
Generated by scripts/anim_slo_frontier.py from data/h100/agg-dp4.points.json, agg-4x-tp1.points.json,
pd-2p1d-dtp2-bs64-run2.points.json (c64 to c1024) and pd-2p1d-dtp2-bs64-run1.points.json (c16 only).
x = tok/s per user = 1000 / ITL p90; y = output tok/s per GPU (all 4 GPUs); hollow = TTFT p90 > 2,000 ms.
TTFT-blind best at >= 35 tok/s/user: 1,368 (P/D 2P(TP1):1D(TP2), block 64, c1024, TTFT p90 33,571 ms, SLO-ok 1.5%).
SLO-respecting best: 915 (P/D 2P(TP1):1D(TP2), block 64, c64, TTFT p90 1,796 ms, SLO-ok 92.7%). Overstatement 49.6%.
-->
<title id="t">A TTFT-blind frontier overstates disaggregated throughput by about 50% on H100</title>
<desc id="d">Animated scatter of output tokens per second per GPU against tokens per second per user (1000 / ITL p90) for three layouts on 4x H100 with Qwen3-30B-A3B, prompt-heavy traffic (4,000 tokens in, 200 out), concurrency 16 to 1,024. First the usual frontier is drawn ignoring time to first token: at or above 35 tokens per second per user its best point is P/D 2P(TP1):1D(TP2), block 64 at concurrency 1024, 1,368 tokens per second per GPU, with TTFT p90 33.6 s and 1.5% of requests meeting the SLO. Then every point with TTFT p90 above 2 s turns hollow, and the frontier is rebuilt from the filled points: its best point is the same P/D layout at concurrency 64, 915 tokens per second per GPU, TTFT p90 1.8 s, 92.7% SLO-ok. The TTFT-blind view is 49.6% higher.</desc>
