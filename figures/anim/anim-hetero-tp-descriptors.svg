<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<!--
Number sources (every number in this figure), all H100, P/D 2P(TP1):1D(TP2), prompt-heavy (4,000 in / 200 out):
  12,005 / 3,024 / 1,536 descriptors per rank-transfer and 1.8 / 10.7 / 12.9 GB/s (c64 window), about 16 KB pieces at block 16,
    45 to 77% post share (TP1-to-TP1 knob arms), NVLink 1-4% (Nsight Systems, 1P:2D TP1 pull block 16, c=256; hetero path not captured):
    data/server-metrics.json (nixl_h100_hetero_tp_2p1d_dtp2_prompt_heavy, nixl_h100_knob_arms_1p2d_tp1_prompt_heavy, nsys_*).
  c=256 req/s, TTFT p90 and ITL p90: data/h100/pd-2p1d-dtp2-bs16.points.json (13.9 req/s, 9.8 s, 73.4 ms),
    pd-2p1d-dtp2-bs64-run1.points.json (25.8, 6.9 s, 17.0 ms), pd-2p1d-dtp2-bs128.points.json (26.1, 6.9 s, 16.3 ms).
  Packet widths (1:4:8) follow block size 16:64:128; emission spacing is computed so width/interval is proportional to GB/s.
-->
<title id="t">Block size decides whether the KV transfer is the bottleneck in 2P (TP1) : 1D (TP2) P/D</title>
<desc id="d">Same 2P (TP1) : 1D (TP2) setup and prompt-heavy workload as the request-path animation; only the KV block size changes. Animated comparison of NIXL KV transfers from a prefill TP1 pod to one decode TP2 rank at block sizes 16, 64 and 128. Each decode rank reads half of every block's KV heads, so block 16 needs 12,005 small descriptors (about 16 KB each) and reaches 1.8 GB/s; block 64 needs 3,024 and reaches 10.7 GB/s; block 128 needs 1,536 and reaches 12.9 GB/s. In a separate TP1-to-TP1 capture NVLink was 1-4% utilized and descriptor posting took 45 to 77% of each transfer; this heterogeneous-TP path was not profiled.</desc>
<style>
  .bg { fill: #ffffff; }
  .ink { fill: #0b0b0b; } .muted { fill: #52514e; }
  .line { stroke: #8a8985; } .lfill { fill: #8a8985; }
  .box { fill: #f4f4f2; stroke: #52514e; }
  .pod { fill: none; stroke: #52514e; }
  .wt { fill: #ffffff; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 17px; font-weight: 600; }
  .label { font-size: 13px; } .small { font-size: 11.5px; } .bold { font-weight: 600; }
  .big { font-size: 16px; font-weight: 600; } .huge { font-size: 20px; font-weight: 700; }
  .still { display: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #ececea; } .muted { fill: #a8a7a3; }
    .line { stroke: #6e7681; } .lfill { fill: #6e7681; }
    .box { fill: #161b22; stroke: #a8a7a3; }
    .pod { stroke: #a8a7a3; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .motion { display: none; }
    .still { display: inline; }
  }
  @keyframes p0 { 0.00% { transform: translate(262.0px, 233.0px); opacity: 1; } 53.33% { transform: translate(696.0px, 233.0px); opacity: 1; } 53.83% { transform: translate(696.0px, 233.0px); opacity: 0; } 100.00% { transform: translate(696.0px, 233.0px); opacity: 0; } }
  @keyframes post0 { 0.00% { opacity: 1; } 6.00% { opacity: 0; } 100.00% { opacity: 0; } }
  @keyframes p1 { 0.00% { transform: translate(262.0px, 337.0px); opacity: 1; } 52.84% { transform: translate(678.0px, 337.0px); opacity: 1; } 53.34% { transform: translate(678.0px, 337.0px); opacity: 0; } 100.00% { transform: translate(678.0px, 337.0px); opacity: 0; } }
  @keyframes post1 { 0.00% { opacity: 1; } 6.00% { opacity: 0; } 100.00% { opacity: 0; } }
  @keyframes p2 { 0.00% { transform: translate(262.0px, 441.0px); opacity: 1; } 47.78% { transform: translate(654.0px, 441.0px); opacity: 1; } 48.28% { transform: translate(654.0px, 441.0px); opacity: 0; } 100.00% { transform: translate(654.0px, 441.0px); opacity: 0; } }
  @keyframes post2 { 0.00% { opacity: 1; } 6.00% { opacity: 0; } 100.00% { opacity: 0; } }
</style>
<rect class="bg" x="0" y="0" width="960" height="600" rx="10"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8985"/></marker></defs>
<text class="ink title" x="24.0" y="34.0">Block size decides if the KV transfer is the bottleneck: at block 16 it is, at 64 it is not</text>
<text class="muted small" x="24.0" y="54.0">Same 2P (TP1) : 1D (TP2) and prompt-heavy load as the request-path figure; only block size varies. GB/s at c=64; one run per size.</text>
<text class="ink label bold" x="24.0" y="90.0">Why: each decode rank reads only half of every block's KV heads</text>
<rect x="60.0" y="104.0" width="120.0" height="26.0" rx="2" fill="#2a78d6" fill-opacity="0.25" stroke="#2a78d6" stroke-width="1.5" />
