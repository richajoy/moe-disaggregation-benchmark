<text class="ink small" x="120.0" y="121.0" text-anchor="middle">first half of heads</text>
<text class="ink small" x="120.0" y="147.0" text-anchor="middle">second half of heads</text>
<text class="muted small" x="120.0" y="174.0" text-anchor="middle">one KV block on prefill (TP1)</text>
<path class="line" d="M184,117 L300,112" stroke-width="1.5" fill="none" marker-end="url(#head)" />
<path class="line" d="M184,143 L300,150" stroke-width="1.5" fill="none" marker-end="url(#head)" />
<rect x="304.0" y="98.0" width="120.0" height="28.0" rx="4" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.5" />
<text class="ink small bold" x="364.0" y="117.0" text-anchor="middle">decode rank 0</text>
<rect x="304.0" y="136.0" width="120.0" height="28.0" rx="4" fill="#eb6834" fill-opacity="0.12" stroke="#eb6834" stroke-width="1.5" />
<text class="ink small bold" x="364.0" y="155.0" text-anchor="middle">decode rank 1</text>
<text class="ink small" x="450.0" y="110.0">So every block becomes a separate read per rank, and each read is one</text>
<text class="ink small" x="450.0" y="126.0">NIXL descriptor the CPU must post. At block 16 that is about 12,000</text>
<text class="ink small" x="450.0" y="142.0">descriptors of about 16 KB per rank-transfer. Bigger blocks mean fewer,</text>
<text class="ink small" x="450.0" y="158.0">larger pieces: descriptors halve with each block-size doubling.</text>
